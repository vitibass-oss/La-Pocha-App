<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Anotador de La Pocha (La Podrida) - Funciona 100% offline sin conexión a internet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="La Pocha" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <title>Anotador de La Pocha (La Podrida)</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isDevHost = location.hostname === 'localhost' || location.hostname.includes('run.app') || location.hostname.includes('stackblitz') || location.hostname.includes('webcontainer');
          if (isDevHost) {
            // Unregister SW in Cloud Run dev server to prevent caching dev proxy loading screens
            navigator.serviceWorker.getRegistrations().then(regs => {
              for (let reg of regs) reg.unregister();
            });
          } else {
            navigator.serviceWorker.register('./sw.js')
              .then(reg => console.log('SW registrado con éxito:', reg.scope))
              .catch(err => console.log('SW fallo al registrar:', err));
          }
        });
      }
    </script>
  </body>
</html>
